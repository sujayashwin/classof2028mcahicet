<style>

    --ink:#1b2333;
    --ink-soft:#4b5468;
    --paper:#faf8f2;
    --paper-raised:#ffffff;
    --line:#e4dfd2;
    --navy:#17284a;
    --navy-deep:#0e1a33;
    --brass:#a9781f;
    --brass-soft:#f1e3c4;
    --leave:#5f7a52;
    --leave-bg:#eaf0e3;
    --holiday:#3c5f8a;
    --holiday-bg:#e4edf6;
    --exam:#9c3d34;
    --exam-bg:#f6e6e2;
    --radius:3px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){

      --ink:#eef0f4; --ink-soft:#b7bccb; --paper:#11141c; --paper-raised:#181c26;
      --line:#2a2f3d; --navy:#1c2c4d; --navy-deep:#0b1120; --brass:#d8ae5f; --brass-soft:#2c2517;
      --leave-bg:#1c2419; --holiday-bg:#182335; --exam-bg:#2a1a17;
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef0f4; --ink-soft:#b7bccb; --paper:#11141c; --paper-raised:#181c26;
    --line:#2a2f3d; --navy:#1c2c4d; --navy-deep:#0b1120; --brass:#d8ae5f; --brass-soft:#2c2517;
    --leave-bg:#1c2419; --holiday-bg:#182335; --exam-bg:#2a1a17;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{ font-family:'Lora',Georgia,serif; }
  a{color:inherit;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  .masthead{
    background: linear-gradient(155deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:#f2f0e8;
    padding: 28px 20px 22px;
    padding-top: calc(28px + env(safe-area-inset-top, 0px));
    position:relative;
    overflow:hidden;
  }
  .masthead::after{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 68px);
    pointer-events:none;
  }
  .masthead-inner{max-width:1080px;margin:0 auto;position:relative;}
  .eyebrow-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .college-name{font-size:12.5px;letter-spacing:.02em;color:#c9d2e6;margin:0;}
  .cohort-tag{font-size:12.5px;color:var(--brass);font-weight:600;}
  .class-title{
    font-size:clamp(28px,5.5vw,44px); font-weight:700; margin:8px 0 4px;
    line-height:1.08;
  }
  .class-sub{color:#c9d2e6;font-size:14.5px;margin:0;max-width:60ch;}

  nav.tabs{
    max-width:1080px;margin:22px auto 0; display:flex; gap:2px;
    border-bottom:1px solid rgba(255,255,255,.14);
  }
  nav.tabs button{
    appearance:none;border:none;background:transparent;color:#c9d2e6;
    font-family:'Inter';font-size:14px;font-weight:600;padding:10px 16px;
    cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
    white-space:nowrap;
  }
  nav.tabs button:hover{color:#fff;}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--brass);}

  main{max-width:1080px;margin:0 auto;padding:32px 20px 80px;}
  section.panel{display:none;}
  section.panel.active{display:block; animation: rise .35s ease both;}
  @media (prefers-reduced-motion: reduce){ section.panel.active{animation:none;} }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .section-head{margin-bottom:22px;}
  .section-head h2{font-size:26px;margin:0 0 6px;}
  .section-head p{margin:0;color:var(--ink-soft);font-size:14.5px;max-width:62ch;}

  /* ---- Students ---- */
  .student-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
  .search-box{
    flex:1; min-width:180px; position:relative;
  }
  .search-box input{
    width:100%; padding:10px 14px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--paper-raised); color:var(--ink); font-family:'Inter'; font-size:14.5px;
  }
  .search-box input:focus{outline:2px solid var(--brass); outline-offset:1px;}
  .count-pill{font-size:12.5px; color:var(--ink-soft); white-space:nowrap;}
  .roster{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px;
  }
  .stu-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px; display:flex; gap:12px; align-items:center;
  }
  .stu-num{
    font-family:'Lora'; font-weight:600; color:var(--brass); font-size:15px;
    width:26px; flex:none; text-align:right;
  }
  .stu-name{font-weight:600; font-size:14.5px; line-height:1.3;}
  .stu-roll{font-size:12px; color:var(--ink-soft); letter-spacing:.02em; margin-top:2px;}
  .empty-state{padding:40px 10px;text-align:center;color:var(--ink-soft);font-size:14px;}

  /* ---- Timetable ---- */
  .day-picker{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;}
  .day-picker button{
    flex:none; padding:8px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--paper-raised); color:var(--ink-soft); font-family:'Inter'; font-weight:600; font-size:13px;
    cursor:pointer;
  }
  .day-picker button.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  table.tt{width:100%; border-collapse:collapse; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  table.tt th{
    background:var(--navy); color:#eef0f4; font-size:11.5px; font-weight:600; letter-spacing:.02em;
    padding:9px 6px; text-align:left; white-space:nowrap;
  }
  table.tt td{padding:0; border-bottom:1px solid var(--line); vertical-align:top;}
  table.tt tr:last-child td{border-bottom:none;}
  .tt-day-label{
    padding:12px 10px; font-weight:700; font-family:'Lora'; font-size:14.5px; color:var(--navy);
    background:var(--brass-soft); white-space:nowrap;
  }

  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tt-day-label{color:#f1e3c4;}}
  .slot{padding:10px 9px; font-size:12.5px; line-height:1.35; min-width:118px;}
  .slot .subj{font-weight:600; display:block;}
  .slot .code{color:var(--ink-soft); font-size:11px; display:block; margin-top:1px;}
  .slot.empty{color:var(--ink-soft); opacity:.4;}
  .slot.brk{background:var(--brass-soft); text-align:center; font-weight:700; font-size:11px; color:var(--brass); writing-mode:vertical-rl; min-width:30px;}
  .slot.lunch{background:var(--holiday-bg); text-align:center; font-weight:700; font-size:11px; color:var(--holiday); writing-mode:vertical-rl; min-width:30px;}
  .tt-scroll{overflow-x:auto; border-radius:var(--radius);}
  .period-times{font-size:10.5px; color:var(--ink-soft); font-weight:500;}

  .day-card{display:none;}

  .slot-row.break-row .what, .slot-row.lunch-row .what{color:var(--brass); font-weight:700;}

  /* ---- Calendar ---- */
  .month-picker{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px;}

  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{font-size:11px; text-align:center; color:var(--ink-soft); font-weight:600; padding-bottom:2px;}
  .cal-cell{
    border-radius:var(--radius); padding:7px 6px; min-height:64px; font-size:11px; cursor:pointer;
    border:1px solid var(--line); background:var(--paper-raised); display:flex; flex-direction:column; gap:3px;
    transition:transform .1s;
  }
  .cal-cell:hover{transform:translateY(-1px);}
  .cal-cell.blank{visibility:hidden;}
  .cal-cell .num{font-family:'Lora'; font-weight:700; font-size:13px;}
  .cal-cell .tag{font-size:9.5px; line-height:1.25; color:var(--ink-soft); overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;}
  .cal-cell.leave{background:var(--leave-bg); border-color:var(--leave);}
  .cal-cell.holiday{background:var(--holiday-bg); border-color:var(--holiday);}
  .cal-cell.exam{background:var(--exam-bg); border-color:var(--exam);}
  .cal-cell.selected{outline:2px solid var(--brass); outline-offset:1px;}
  .cal-detail{
    margin-top:18px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);

  .cal-detail .d-date{font-family:'Lora'; font-weight:700; font-size:16px; margin-bottom:4px;}
  .cal-detail .d-label{font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
  .cal-detail .d-badge{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.02em; padding:2px 8px; border-radius:20px; margin-bottom:8px;}
  .b-leave{background:var(--leave-bg); color:var(--leave);}
  .b-holiday{background:var(--holiday-bg); color:var(--holiday);}
  .b-exam{background:var(--exam-bg); color:var(--exam);}
  .b-work{background:var(--brass-soft); color:var(--brass);}

  .fac-table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius);}
  table.fac{width:100%; border-collapse:collapse; background:var(--paper-raised); font-size:13.5px;}
  table.fac th{
    background:var(--navy); color:#eef0f4; text-align:left; padding:10px 12px; font-size:11.5px; font-weight:600; white-space:nowrap;

  table.fac td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.fac tr:last-child td{border-bottom:none;}
  .cat-pill{
    font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:.02em; white-space:nowrap;
    background:var(--brass-soft); color:var(--brass);
  }
  .fac-note{margin-top:14px; font-size:12.5px; color:var(--ink-soft);}

  footer{
    text-align:center; padding:26px 20px calc(26px + env(safe-area-inset-bottom,0px)); color:var(--ink-soft); font-size:12px; border-top:1px solid var(--line);

  @media (max-width:640px){
    .tt-wide{display:none;}
  }
  @media (min-width:641px){
    .tt-narrow{display:none;}
  }
</style>
</head>

const monthKeys = Object.keys(calendarData);
// weekday index for the 1st of each month (2026): Jun=Mon(1),Jul=Wed(3),Aug=Sat(6),Sep=Tue(2),Oct=Thu(4),Nov=Sun(0)
const monthLead = {"Jun 2026":1,"Jul 2026":3,"Aug 2026":6,"Sep 2026":2,"Oct 2026":4,"Nov 2026":0};

/* ---------------- APP ---------------- */

const App = {
  setup(){
    const tab = ref('students');
    const tabs = [
      {id:'students', label:'Students'},
      {id:'timetable', label:'Timetable'},
      {id:'calendar', label:'Academic Calendar'},
      {id:'faculty', label:'Faculty'},
    ];

    // students
    const query = ref('');
    const filteredStudents = computed(()=>{
      const q = query.value.trim().toLowerCase();
      if(!q) return students;
      return students.filter(s => s.name.toLowerCase().includes(q) || s.roll.toLowerCase().includes(q));
    });

    // timetable
    const today = new Date();
    const todayIdx = today.getDay(); // 0 Sun .. 6 Sat
    const defaultDay = (todayIdx>=1 && todayIdx<=6) ? dayNames[todayIdx-1] : 'Monday';
    const activeDay = ref(defaultDay);

    // calendar
    const activeMonth = ref('Jun 2026');
    const selectedDay = ref(null);
    function pickMonth(m){ activeMonth.value = m; selectedDay.value = null; }
    function cellsFor(m){
      const lead = monthLead[m];
      const blanks = Array.from({length:lead}, (_,i)=>({blank:true,key:'b'+i}));
      return [...blanks, ...calendarData[m]];
    }
    function selectDay(day){ if(day.blank) return; selectedDay.value = day; }
    const badgeClass = (type)=> type==='leave'?'b-leave':type==='holiday'?'b-holiday':type==='exam'?'b-exam':'b-work';
    const badgeText = (type)=> type==='leave'?'Sunday / leave':type==='holiday'?'Holiday':type==='exam'?'Exam / assessment':'Working day';

    return { tab, tabs, query, filteredStudents, students,
             periodTimes, timetable, dayNames, activeDay,
             faculty,
             monthKeys, activeMonth, pickMonth, cellsFor, selectedDay, selectDay, badgeClass, badgeText };
  },
  template: `
  <header class="masthead">
    <div class="masthead-inner">
      <div class="eyebrow-row">
        <p class="college-name">Hindusthan College of Engineering and Technology, Coimbatore</p>
        <span class="cohort-tag">Class of 2028</span>
      </div>
      <h1 class="class-title serif">I Year MCA · Semester One</h1>
      <p class="class-sub">Department of Computer Applications — roster, weekly timetable, odd-semester academic calendar and faculty in charge, all in one place for the batch.</p>
    </div>
    <nav class="tabs">
      <button v-for="t in tabs" :key="t.id" :class="{active: tab===t.id}" @click="tab=t.id">{{ t.label }}</button>
    </nav>
  </header>

  <main>

    <!-- STUDENTS -->
    <section class="panel" :class="{active: tab==='students'}">
      <div class="section-head">
        <h2 class="serif">Class Roster</h2>
        <p>All {{ students.length }} students of I Year MCA, Semester One.</p>
      </div>
      <div class="student-toolbar">
        <div class="search-box">
          <input type="text" v-model="query" placeholder="Search by name or roll number…" aria-label="Search students">
        </div>
        <span class="count-pill">{{ filteredStudents.length }} of {{ students.length }} shown</span>
      </div>
      <div class="roster" v-if="filteredStudents.length">
        <div class="stu-card" v-for="s in filteredStudents" :key="s.roll">
          <div class="stu-num">{{ s.sno }}</div>
          <div>
            <div class="stu-name">{{ s.name }}</div>
            <div class="stu-roll">{{ s.roll }}</div>
          </div>
        </div>
      </div>
      <div class="empty-state" v-else>No student matches “{{ query }}”.</div>
    </section>

    <!-- TIMETABLE -->
    <section class="panel" :class="{active: tab==='timetable'}">
      <div class="section-head">
        <h2 class="serif">Weekly Timetable</h2>
        <p>Hall B 107 &middot; Odd Semester 2026–27. Bridge sessions cover POP &amp; OOP and Web Design foundations.</p>
      </div>

      <!-- wide table, tablet/desktop -->
      <div class="tt-wide tt-scroll">
        <table class="tt">
          <thead>
            <tr>
              <th>Day</th>
              <th v-for="(pt,i) in periodTimes" :key="i" :class="{}">
                <span v-if="pt!=='BREAK' && pt!=='LUNCH'" class="period-times">{{ pt }}</span>
                <span v-else>{{ pt }}</span>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="d in dayNames" :key="d">
              <td class="tt-day-label">{{ d }}</td>
              <td v-for="(slot,i) in timetable[d]" :key="i"
                  :class="['slot', slot.t==='break' ? 'brk' : slot.t==='lunch' ? 'lunch' : slot.t==='empty' ? 'empty' : '']">
                <template v-if="slot.t==='class'">
                  <span class="subj">{{ slot.subj }}</span>
                  <span class="code">{{ slot.code }}</span>
                </template>
                <template v-else-if="slot.t==='break'">BREAK</template>
                <template v-else-if="slot.t==='lunch'">LUNCH</template>
                <template v-else>—</template>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- narrow, mobile: pick a day -->
      <div class="tt-narrow">
        <div class="day-picker">
          <button v-for="d in dayNames" :key="d" :class="{active: activeDay===d}" @click="activeDay=d">{{ d.slice(0,3) }}</button>
        </div>
        <div v-for="d in dayNames" :key="d" class="day-card" :class="{show: activeDay===d}">
          <div v-for="(slot,i) in timetable[d]" :key="i"
               class="slot-row" :class="{'break-row': slot.t==='break', 'lunch-row': slot.t==='lunch'}">
            <div class="when">{{ periodTimes[i] }}</div>
            <div class="what">
              <template v-if="slot.t==='class'">
                {{ slot.subj }}
                <small>{{ slot.code }}</small>
              </template>
              <template v-else-if="slot.t==='break'">Break</template>
              <template v-else-if="slot.t==='lunch'">Lunch</template>
              <template v-else>Free period</template>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- CALENDAR -->
    <section class="panel" :class="{active: tab==='calendar'}">
      <div class="section-head">
        <h2 class="serif">Academic Calendar</h2>
        <p>Odd semester 2026–27, college-wide. Semester started 08 June 2026; the working-day count (Day 1, Day 2 …) runs continuously across the term.</p>
      </div>

      <div class="month-picker">
        <button v-for="m in monthKeys" :key="m" :class="{active: activeMonth===m}" @click="pickMonth(m)">{{ m }}</button>
      </div>

      <div class="legend">
        <span><i class="dot" style="background:var(--brass)"></i> Working day</span>
        <span><i class="dot" style="background:var(--exam)"></i> Test / exam</span>
        <span><i class="dot" style="background:var(--holiday)"></i> Holiday</span>
        <span><i class="dot" style="background:var(--leave)"></i> Sunday / leave</span>
      </div>

      <div class="cal-grid">
        <div class="cal-dow" v-for="dn in ['Mo','Tu','We','Th','Fr','Sa','Su']" :key="dn">{{ dn }}</div>
        <div v-for="cell in cellsFor(activeMonth)" :key="cell.key || (cell.month+cell.d)"
             class="cal-cell" :class="[cell.blank ? 'blank' : (cell.type||'work'), {selected: selectedDay===cell}]"
             @click="selectDay(cell)">
          <template v-if="!cell.blank">
            <span class="num">{{ cell.d }}</span>
            <span class="tag">{{ cell.label }}</span>
          </template>
        </div>
      </div>

      <div class="cal-detail" v-if="selectedDay">
        <span class="d-badge" :class="badgeClass(selectedDay.type)">{{ badgeText(selectedDay.type) }}</span>
        <div class="d-date serif">{{ selectedDay.dow }}, {{ selectedDay.d }} {{ selectedDay.month }}</div>
        <div class="d-label">{{ selectedDay.label || 'No events recorded for this day.' }}</div>
      </div>
    </section>

    <!-- FACULTY -->
    <section class="panel" :class="{active: tab==='faculty'}">
      <div class="section-head">
        <h2 class="serif">Faculty In Charge</h2>
        <p>Subject-wise faculty for Semester One. No single class advisor was listed on the source timetable — add one here if your department assigns one.</p>
      </div>
      <div class="fac-table-wrap">
        <table class="fac">
          <thead>
            <tr><th>Category</th><th>Code</th><th>Subject</th><th>Cr</th><th>Hrs</th><th>Faculty</th></tr>
          </thead>
          <tbody>
            <tr v-for="f in faculty" :key="f.code">
              <td><span class="cat-pill">{{ f.cat }}</span></td>
              <td>{{ f.code }}</td>
              <td>{{ f.name }}</td>
              <td>{{ f.cr }}</td>
              <td>{{ f.hrs }}</td>
              <td>{{ f.fac }}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="fac-note">Cr = credits, Hrs = weekly contact hours. Bridge courses carry no credit and support students transitioning into the programme.</p>
    </section>

  </main>

  <footer>
    Hindusthan College of Engineering and Technology · Department of Computer Applications · I Year MCA, Class of 2028
  </footer>
  `
};

createApp(App).mount('#app');
</script>
</body>
